<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>LudereZone</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Comic Sans MS;
      background: linear-gradient(135deg, #0f0f14, #1a1a2e);
      color: white;
    }

    .container {
      display: flex;
      height: 100vh;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: rgba(255,255,255,0.05);
      padding: 60px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      width: 600px;
      box-shadow: 0 0 25px rgba(127, 255, 0, 0.9);
    }

    .success {
    color: #32CD32;
    margin-top: 10px;
    text-shadow: 0 0 10px #32CD32;
    }

    h2 {
      text-align: center;
      text-shadow: 0 0 10px #32CD32;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #1a1a22;
      color: white;
    }

    button {
      width: 103%;
      padding: 10px;
      margin-top: 20px;
      background: linear-gradient(70deg, #39CD39, #30CD30);
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }

    button:hover {
      box-shadow: 0 0 20px #32CD32;
    }

    .link {
      margin-top: 15px;
      cursor: pointer;
      text-align: center;
      color: #ccc;
    }

    .error {
      color: red;
      margin-top: 10px;
    }
  </style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

function App() {
  const [mode, setMode] = React.useState("login");
  const [login, setLogin] = React.useState("");
  const [password, setPassword] = React.useState("");
  const [user, setUser] = React.useState(null);
  const [error, setError] = React.useState("");
  const [success, setSuccess] = React.useState("");

  React.useEffect(() => {
    fetch("/api/me")
      .then(res => res.json())
      .then(data => setUser(data.user));
  }, []);

  const clearMessages = () => {
    setError("");
    setSuccess("");
  };

  const handleLogin = async () => {
    clearMessages();

    const res = await fetch("/api/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({login, password})
    });

    const data = await res.json();

    if (res.ok) {
      setUser({login});
    } else {
      setError(data.error);
    }
  };

  const handleRegister = async () => {
    clearMessages();
    console.log("REGISTER CLICKED");
    const res = await fetch("/api/register", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({login, password})
    });

    const data = await res.json();

    if (res.ok) {
      setSuccess("Регистрация прошла успешно 🎉");

      // авто переключение на логин
      setTimeout(() => {
        setMode("login");
        setSuccess("");
      }, 1500);

    } else {
      setError(data.error);
    }
  };

  const logout = async () => {
    await fetch("/api/logout");
    setUser(null);
  };

  if (user) {
    return (
      <div className="container">
        <div className="card">
          <h2>Главный экран</h2>
          <p>Ты вошёл в систему 👌</p>
          <button onClick={logout}>Выйти</button>
        </div>
      </div>
    );
  }

  return (
    <div className="container">
      <div className="card">
        <h2>{mode === "login" ? "Вход" : "Регистрация"}</h2>

        <input
          placeholder="Логин"
          value={login}
          onChange={e => setLogin(e.target.value)}
        />

        <input
          type="password"
          placeholder="Пароль"
          value={password}
          onChange={e => setPassword(e.target.value)}
        />


        {mode === "login" ? (
             <button onClick={handleLogin}>Войти</button>
        ) : (
             <button onClick={handleRegister}>Зарегистрироваться</button>
        )}


        {error && <div className="error">{error}</div>}
        {success && <div className="success">{success}</div>}

        <div
          className="link"
          onClick={() => {
            setMode(mode === "login" ? "register" : "login");
            clearMessages();
          }}
        >
          {mode === "login" ? "Нет аккаунта?" : "Уже есть аккаунт?"}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
