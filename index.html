<!DOCTYPE html>
<html lang="ru">
<head>
    <link
  rel="icon"
  type="image/png"
  href="https://avatars.mds.yandex.net/i?id=a9d97cd9061e58b21ac85698bbe0742412ca9af2-3713143-images-thumbs&n=13"
/>
</head>
<meta charset="UTF-8">
<title>LudereZone</title>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

<style>

*{box-sizing:border-box;}

body{
  margin:0;
  font-family: 'Comic Sans MS';
  background:
    radial-gradient(circle at top left,#1f4037,#0f2027);
  color:white;
  min-height:100vh;
}

.container{
  padding:40px;
}

.card{
  background:rgba(255,255,255,0.06);
  border-radius:25px;
  backdrop-filter: blur(12px);
  padding:30px;
  box-shadow:0 0 25px rgba(50,205,50,0.35);
}

.auth-wrapper{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.auth-card{
  width:450px;
}

h1,h2,h3{
  text-shadow:0 0 12px #32CD32;
}

input{
  width:90%;
  padding:14px;
  margin-top:15px;
  border:none;
  border-radius:12px;
  background:#111827;
  color:white;
  font-size:16px;
}

button{
  border:none;
  border-radius:12px;
  padding:12px 18px;
  margin-top:15px;
  cursor:pointer;
  background:linear-gradient(135deg,#32CD32,#228B22);
  color:white;
  font-size:15px;
  transition:0.3s;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 0 20px #32CD32;
}

.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.nav-left{
  display:flex;
  gap:15px;
}

.nav-title{
  font-size:28px;
  font-weight:bold;
  color:#90EE90;
  text-shadow:0 0 15px #32CD32;
}

.page-title{
  margin-bottom:25px;
}

.toys-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:2px;
}

.toy-card{
  background:rgba(255,255,255,0.06);
  border-radius:20px;
  padding:20px;
  transition:0.3s;
  border:10px solid rgba(255,255,255,0.05);
}

.toy-card:hover{
  transform:translateY(-5px);
  box-shadow:0 0 25px rgba(50,205,50,0.35);
}

.toy-name{
  font-size:22px;
  margin-bottom:10px;
  color:#90EE90;
}

.toy-price{
  font-size:20px;
  margin:10px 0;
}

.toy-info{
  color:#ccc;
  margin-top:5px;
}

.toy-image{
  width:100%;
  height:240px;
  object-fit:cover;
  border-radius:16px;
  margin-bottom:15px;
  display:block;
  background:#111827;
}

.search-bar{
  display:flex;
  gap:10px;
  margin-bottom:25px;
}

.search-bar input{
  margin-top:0;
}

select{
  padding:15px;
  border:none;
  border-radius:12px;
  background:#111827;
  color:white;
  font-size:16px;
}

.error{
  color:#ff6b6b;
  margin-top:15px;
}

.success{
  color:#90EE90;
  margin-top:15px;
}

.home-box{
  text-align:center;
  padding:60px;
}

.home-box h1{
  font-size:48px;
}

.home-box p{
  font-size:20px;
  color:#ccc;
}

.toy-info{
  margin-top:8px;
  color:#d1d5db;
  line-height:1.4;
}

.toy-description{
  margin-top:10px;
  color:#cbd5e1;
}
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

function App() {
  const [user, setUser] = React.useState(null);
  const [page, setPage] = React.useState("login");
  const [login, setLogin] = React.useState("");
  const [oldPassword, setOldPassword] = React.useState("");
  const [newPassword, setNewPassword] = React.useState("");
  const [password, setPassword] = React.useState("");
  const [error, setError] = React.useState("");
  const [success, setSuccess] = React.useState("");


  const [selectedToy, setSelectedToy] = React.useState(null);
  const [toys, setToys] = React.useState([]);
  const [query, setQuery] = React.useState("");
  const [age, setAge] = React.useState("");
  const [favorites, setFavorites] = React.useState([])
  const [cart, setCart] = React.useState([]);

  const [category, setCategory] = React.useState("");
  const [sort, setSort] = React.useState("");




  React.useEffect(() => {
  fetch("/api/me")
    .then(res => res.json())
    .then(data => {
      if (data) {
        setUser(data.user);
        setLogin(data.user.login || "");
      }
    });
}, []);

  // ---------------- auth ----------------

  const handleLogin = async () => {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({login, password})
    });

    const data = await res.json();

    if (!res.ok) {
      setError(data.error);
    } else {
      setUser({login});
      setPage("home");
    }
  };

  const handleRegister = async () => {
    const res = await fetch("/api/register", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({login, password})
    });

    const data = await res.json();

    if (!res.ok) {
      setError(data.error);
    } else {
      setPage("login");
    }
  };

  const logout = async () => {
    await fetch("/api/logout");
    setUser(null);
    setPage("login");
  };
  const changePassword = async () => {

  const res = await fetch(
    "/api/change-password",
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        old_password:oldPassword,
        new_password:newPassword
      })
    }
  );

  const data = await res.json();

  if(res.ok){
    alert("Пароль изменён");

    setOldPassword("");
    setNewPassword("");
  }
  else{
    alert(data.error);
  }
};
  // ---------------- data ----------------

  const loadToys = async () => {
    const res = await fetch("/api/toys");
    setToys(await res.json());
  };

  const search = async () => {
    const res = await fetch(`/api/toys/search?q=${query}`);
    setToys(await res.json());
  };

  const filterAndSort = async () => {

  const res = await fetch("/api/toys");
  let data = await res.json();

  //фильтр
  if (category) {
    data = data.filter(
      t => t.category === category
    );
  }

  //сортировка
  if (sort === "price_asc") {
    data.sort((a,b) => a.price - b.price);
  }

  if (sort === "price_desc") {
    data.sort((a,b) => b.price - a.price);
  }

  if (sort === "name") {
    data.sort((a,b) =>
      a.name.localeCompare(b.name)
    );
  }

  setToys(data);
};

  const searchAge = async () => {
    const res = await fetch(`/api/toys/age?age=${age}`);
    setToys(await res.json());
  };

  const addToCart = async (id) => {
    await fetch("/api/cart", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({toy_id: id})
    });
    alert("Добавлено");
  };

  const loadCart = async () => {
    const res = await fetch("/api/cart");
    const data = await res.json();
    setCart(data);
  };


const removeFromCart = async (id) => {
  await fetch(`/api/cart/${id}`, {
    method:"DELETE"
  });

  loadCart();
};

const openToy = async (id) => {
  const res = await fetch(`/api/toys/${id}`);
  const data = await res.json();
  setSelectedToy(data);
  setPage("toy");
};

  const addToFavorites = async (id) => {
  await fetch("/api/favorites", {
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },

    body:JSON.stringify({
      toy_id:id
    })
  });
  alert("Добавлено в любимку");
};

const loadFavorites = async () => {
  const res = await fetch("/api/favorites");
  const data = await res.json();
  setFavorites(data);
};


const removeFavorite = async (id) => {

  await fetch(`/api/favorites/${id}`, {
    method:"DELETE"
  });

  loadFavorites();
};

  // ---------------- UI ----------------

if (!user) {
  return (
    <div className="auth-wrapper">

      <div className="card auth-card">

        <h2>
          {page === "login"
            ? "Вход в LudereZone"
            : "Регистрация"}
        </h2>

        <input
          placeholder="Логин"
          value={login}
          onChange={e => setLogin(e.target.value)}
        />

        <input
          type="password"
          placeholder="Пароль"
          value={password}
          onChange={e => setPassword(e.target.value)}
        />

        {page === "login" ? (
          <button onClick={handleLogin}>
            Войти
          </button>
        ) : (
          <button onClick={handleRegister}>
            Зарегистрироваться
          </button>
        )}

        {error && <div className="error">{error}</div>}
        {success && <div className="success">{success}</div>}

        <div
          className="link"
          onClick={() => {
            setPage(page === "login" ? "register" : "login");
            setError("");
            setSuccess("");
          }}
        >
          {page === "login"
            ? "Нет аккаунта?"
            : "Уже есть аккаунт?"}
        </div>


      </div>
    </div>
  );
}
  return (
  <div className="container">

    <div className="navbar">

      <button onClick={() => {
         setPage("cart");
         loadCart();
      }}>
        🛒 Корзина
      </button>


      <button onClick={() => {
        setPage("favorites");
        loadFavorites();
      }}>
        ❤️ Любимки
      </button>

      <button onClick={() => setPage("profile")}>
          👤 Профиль
      </button>

      <div className="nav-title">
        LudereZone
      </div>

      <div className="nav-left">
        <button onClick={() => setPage("home")}>
          Главная
        </button>

        <button onClick={() => {
          setPage("toys");
          loadToys();
        }}>
          Игрушки
        </button>

        <button onClick={() => setPage("age")}>
          Подбор по возрасту
        </button>

        <button onClick={logout}>
          Выйти
        </button>
      </div>
    </div>

    {page === "home" && (
      <div className="card home-box">

        <h1>Добро пожаловать 👾</h1>

        <p>
          Единственный магазин игрушек для тебя, смирись
        </p>

      </div>
    )}

    {page === "toys" && (
      <div>

        <h2 className="page-title">
          Каталог игрушек
        </h2>

        <div className="search-bar">

        <div className="search-bar">

  <select
    value={category}
    onChange={e => setCategory(e.target.value)}
  >
    <option value="">
      Все категории
    </option>

    <option value="Конструкторы">
      Конструкторы
    </option>

    <option value="Роботы">
      Роботы
    </option>

    <option value="Игровые наборы">
      Игровые наборы
    </option>

  </select>

  <select
    value={sort}
    onChange={e => setSort(e.target.value)}
  >
    <option value="">
      Без сортировки
    </option>

    <option value="price_asc">
      Цена ↑
    </option>

    <option value="price_desc">
      Цена ↓
    </option>

    <option value="name">
      По названию
    </option>

  </select>

  <button onClick={filterAndSort}>
    Применить
  </button>

</div>

          <input
            placeholder="Поиск игрушек..."
            onChange={e => setQuery(e.target.value)}
          />

          <button onClick={search}>
            Найти
          </button>
        </div>

        <div className="toys-grid">

  {toys.map(t => (

    <div className="toy-card"
        key={t.id}
        onClick={() => openToy(t.id)}
    >

      <div className="age-badge">
        {t.min_age}+
      </div>

      <img
        className="toy-image"
        src={t.image_url || "/static/images/no-image.jpg"}
        alt={t.name}
      />

      <div className="toy-name">
        {t.name}
      </div>

      <div className="toy-description">
        {t.description}
      </div>

      <div className="toy-price">
        {t.price} BYN
      </div>

      <div className="toy-info">
        Производитель: {t.manufacturer}
      </div>

      <div className="toy-info">
        Категория: {t.category}
      </div>

      <div className="stock">
        В наличии: {t.quantity}
      </div>

      <button
        className="buy-btn"
        onClick={() => addToCart(t.id)}
      >
        🛒 Добавить в корзину
      </button>

      <button
        onClick={(e) => {

            e.stopPropagation();

            addToFavorites(t.id);
        }}
      >
        ❤️
      </button>


    </div>

  ))}

</div>

      </div>
    )}

    {page === "age" && (

      <div>

        <h2 className="page-title">
          Подбор по возрасту
        </h2>

        <div className="search-bar">

          <input
            placeholder="Введите возраст..."
            onChange={e => setAge(e.target.value)}
          />

          <button onClick={searchAge}>
            Подобрать
          </button>

        </div>

      </div>
    )}

    {page === "toy" && selectedToy && (

  <div className="card">

    <button onClick={() => setPage("toys")}>
      ← Назад
    </button>

    <div style={{marginTop:"25px"}}>

      <img
        src={selectedToy.image_url}
        className="toy-image"
        style={{
          maxWidth:"400px",
          height:"400px",
          objectFit:"cover"
        }}
      />

      <h1>{selectedToy.name}</h1>

      <div className="toy-price">
        {selectedToy.price} BYN
      </div>

      <div className="toy-description">
        {selectedToy.description}
      </div>

      <div className="toy-info">
        Производитель: {selectedToy.manufacturer}
      </div>

      <div className="toy-info">
        Категория: {selectedToy.category}
      </div>

      <div className="toy-info">
        Возраст: {selectedToy.min_age}+
      </div>

      <div className="toy-info">
        В наличии: {selectedToy.quantity}
      </div>

      <button
        onClick={() => addToCart(selectedToy.id)}
      >
        🛒 Добавить в корзину
      </button>

      <button
        onClick={() =>
          addToFavorites(selectedToy.id)
        }
      >
        ❤️ В любимки
      </button>

    </div>

  </div>

)}


  {page === "profile" && (

  <div className="card">

    <h1>
      Личный кабинет
    </h1>

    <div className="toy-info">
      Логин: {login}
    </div>

    <div className="toy-info">
      Роль: Пользователь
    </div>

    <div style={{marginTop:"30px"}}>

      <h2>
        Смена пароля
      </h2>

      <input
        type="password"
        placeholder="Старый пароль"
        value={oldPassword}
        onChange={e =>
          setOldPassword(e.target.value)
        }
      />

      <input
        type="password"
        placeholder="Новый пароль"
        value={newPassword}
        onChange={e =>
          setNewPassword(e.target.value)
        }
      />

      <button onClick={changePassword}>
        Изменить пароль
      </button>

    </div>

    <div style={{marginTop:"30px"}}>

      <button onClick={() => {
        setPage("favorites");
        loadFavorites();
      }}>
        ❤️ Любимки
      </button>

    </div>

  </div>

)}

  {page === "favorites" && (

  <div>

    <h2 className="page-title">
      ❤️ Любимки
    </h2>

    <div className="toys-grid">

      {favorites.map(t => (

        <div
          className="toy-card"
          key={t.id}
          onClick={() => openToy(t.id)}
        >

          <img
            className="toy-image"
            src={t.image_url}
          />

          <div className="toy-name">
            {t.name}
          </div>

          <div className="toy-price">
            {t.price} BYN
          </div>

          <button
            onClick={(e) => {

              e.stopPropagation();

              removeFavorite(t.id);
            }}
          >
            ❌ Удалить
          </button>

        </div>

      ))}

    </div>

  </div>

)}


  {page === "cart" && (

  <div>

    <h2 className="page-title">
      🛒 Корзина
    </h2>

    {cart.length === 0 && (
      <div className="card">
        Корзина пуста
      </div>
    )}

    <div className="toys-grid">

      {cart.map(item => (

        <div
          className="toy-card"
          key={item.cart_id}
        >

          <img
            className="toy-image"
            src={item.toy.image_url}
          />

          <div className="toy-name">
            {item.toy.name}
          </div>

          <div className="toy-price">
            {item.toy.price} BYN
          </div>

          <div className="toy-info">
            Количество: {item.quantity}
          </div>

          <button
            onClick={() =>
              removeFromCart(item.cart_id)
            }
          >
            ❌ Удалить
          </button>

        </div>

      ))}

    </div>

    {cart.length > 0 && (

      <div
        className="card"
        style={{marginTop:"30px"}}
      >

        <h2>

          Итого:

          {" "}

          {cart.reduce(
            (sum, item) =>
              sum + (
                item.toy.price *
                item.quantity
              ),
            0
          ).toFixed(2)}

          {" "}BYN

        </h2>

      </div>

    )}

  </div>

)}


  </div>
 );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
